[project]
name = "sec-webapi-demo"
version = "0.1.0"
description = "WebAPIの設計と実装のコツ — 研修デモ（FastAPI / PostgreSQL(Supabase) / MongoDB(Atlas)）"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "pydantic-settings>=2.4",
    "asyncpg>=0.30",
    "pymongo>=4.13",           # Motorは非推奨。PyMongo Async API（AsyncMongoClient）を使う
    "redis>=5.2",
    "pyjwt[crypto]>=2.9",
    "httpx>=0.27",
    "mcp>=1.9",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-http",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-instrumentation-asyncpg",
    "opentelemetry-instrumentation-pymongo",
    "opentelemetry-instrumentation-redis",
    "opentelemetry-instrumentation-httpx",
    "opentelemetry-instrumentation-logging",
]

[dependency-groups]
dev = ["ruff>=0.6"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008", "E501"]  # FastAPIの Depends() / Query() はデフォルト引数で使うのが流儀
